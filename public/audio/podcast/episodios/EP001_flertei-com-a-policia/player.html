<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EP001 — Como Eu Flertei com a Polícia em Portugal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .container { max-width: 800px; width: 100%; }
  h1 { font-size: 28px; margin-bottom: 8px; color: #9FE870; }
  .subtitle { color: #888; margin-bottom: 30px; }
  .cover {
    width: 200px; height: 200px;
    background: linear-gradient(135deg, #9FE870 0%, #FF6B35 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 72px; margin-bottom: 30px;
  }
  audio { width: 100%; margin-bottom: 20px; }
  .meta { display: flex; gap: 20px; color: #888; font-size: 14px; margin-bottom: 30px; }
  .chapters { width: 100%; }
  .chapters h2 { font-size: 18px; margin-bottom: 16px; color: #9FE870; }
  .chapter {
    display: flex; align-items: center;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid #222;
  }
  .chapter:hover { background: #1a1a1a; }
  .chapter-time {
    font-family: 'SF Mono', monospace;
    font-size: 14px;
    color: #9FE870;
    min-width: 100px;
  }
  .chapter-info { flex: 1; }
  .chapter-title { font-weight: 500; }
  .chapter-desc { font-size: 13px; color: #888; margin-top: 2px; }
  .chapter.active { background: #1a2a15; }
  .playing { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
  .bar { width: 3px; background: #9FE870; animation: pulse 1s infinite; }
  .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 14px; animation-delay: 0.2s; }
  .bar:nth-child(3) { height: 10px; animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="cover">🎙️</div>
  <h1>EP001</h1>
  <p class="subtitle">Como Eu Flertei com a Polícia em Portugal</p>

  <audio id="player" controls>
    <source src="EP001_flertei-com-a-policia_master.mp3" type="audio/mpeg">
  </audio>

  <div class="meta">
    <span>⏱️ 9:17</span>
    <span>🔊 -16 LUFS</span>
    <span>🎙️ Jessica (ElevenLabs)</span>
  </div>

  <div class="chapters">
    <h2>Capítulos</h2>
    <div id="chapter-list"></div>
  </div>
</div>

<script>
const chapters = [
  { start: 0, end: 17, title: "Abertura", desc: "Intro Muuday" },
  { start: 17, end: 25, title: "seg01 [smiling]", desc: "Se tem uma coisa que eu aprendi..." },
  { start: 25, end: 33, title: "seg02 [narrating]", desc: "Hoje a gente vai falar sobre..." },
  { start: 33, end: 40, title: "seg03 [laughs]", desc: "Tem uma coisa que ninguém me avisou..." },
  { start: 40, end: 50, title: "seg04 [laughs]", desc: "Eu não sei identificar um policial..." },
  { start: 50, end: 60, title: "seg05 [laughs]", desc: "Mas a gente não presta atenção..." },
  { start: 60, end: 76, title: "seg06 [narrating]", desc: "E é por isso que a história de hoje..." },
  { start: 76, end: 87, title: "seg07 [smiling]", desc: "Tipo, ACABADO. Tipo, chegou na segunda..." },
  { start: 87, end: 102, title: "seg08 [laughs]", desc: "Ela me contou que, na primeira noite..." },
  { start: 102, end: 128, title: "seg09 [narrating]", desc: "Resultado: jantou pão de uma padaria..." },
  { start: 128, end: 142, title: "seg10 [laughs]", desc: "Sem mapa. Sem GPS. Sem plano..." },
  { start: 142, end: 156, title: "seg11 [narrating]", desc: "Alfama, pra quem não conhece..." },
  { start: 156, end: 178, title: "seg12 [laughs]", desc: "Mariana andou por umas duas horas..." },
  { start: 178, end: 188, title: "seg13 [smiling]", desc: "Ela sentou num banco. Colocou as duas malas..." },
  { start: 188, end: 209, title: "seg14 [laughs]", desc: "E enquanto respirava, ela olhou pro celular..." },
  { start: 209, end: 219, title: "seg15 [narrating]", desc: "E foi nesse momento de paz..." },
  { start: 219, end: 232, title: "seg16 [smiling]", desc: "Mariana olhou. Ele olhou de volta..." },
  { start: 232, end: 243, title: "seg17 [laughs]", desc: "Mas Mariana é brasileira..." },
  { start: 243, end: 259, title: "seg18 [laughs]", desc: "E ela pensou: Vou ser corajosa..." },
  { start: 259, end: 281, title: "seg19 [laughs]", desc: "Ele parou. Olhou. Surpreso, mas gentil..." },
  { start: 281, end: 292, title: "seg20 [smiling]", desc: "Ele respondeu, educado: Conheço sim..." },
  { start: 292, end: 307, title: "seg21 [smiling]", desc: "Ela continuou. E continuou. E continuou..." },
  { start: 307, end: 321, title: "seg22 [laughs]", desc: "Ela não fazia ideia de como era..." },
  { start: 321, end: 342, title: "seg23 [laughs]", desc: "Eu acabei de chegar do Brasil..." },
  { start: 342, end: 364, title: "seg24 [laughs]", desc: "Ele deu uma risada. Curta. Discreta..." },
  { start: 364, end: 380, title: "seg25 [smiling]", desc: "E aí ela foi mais longe..." },
  { start: 380, end: 395, title: "seg26 [narrating]", desc: "Perguntou se ele gostava de café..." },
  { start: 395, end: 397, title: "seg27 [whispering]", desc: "Ele levou a mão à cintura..." },
  { start: 397, end: 406, title: "seg28 [narrating]", desc: "Tirou um objeto. Um quadradinho de metal..." },
  { start: 406, end: 426, title: "seg29 [narrating]", desc: "Documentos? Pra quê? A gente tá só conversando..." },
  { start: 426, end: 447, title: "seg30 [laughs]", desc: "Mariana congelou. Policial?..." },
  { start: 447, end: 456, title: "seg31 [laughs]", desc: "Era um policial. Que ela tinha flertado..." },
  { start: 456, end: 472, title: "seg32 [smiling]", desc: "E ela tinha perguntado se ele gostava..." },
  { start: 472, end: 486, title: "seg33 [laughs]", desc: "Ele olhou o passaporte. Olhou para ela..." },
  { start: 486, end: 502, title: "seg34 [smiling]", desc: "Ele disse, ainda rindo: Você não é suspeita..." },
  { start: 502, end: 514, title: "seg35 [narrating]", desc: "Mariana me contou essa história um mês depois..." },
  { start: 514, end: 525, title: "seg36 [smiling]", desc: "Mas ela também me contou que, três semanas depois..." },
  { start: 525, end: 538, title: "seg37 [smiling]", desc: "E dessa vez, o uniforme era jeans..." },
  { start: 538, end: 541, title: "seg38 [smiling]", desc: "E não esquece de seguir a gente..." },
  { start: 542, end: 557, title: "Fechamento", desc: "CTA + despedida" }
];

const player = document.getElementById('player');
const list = document.getElementById('chapter-list');
let currentIndex = -1;

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function renderChapters() {
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'chapter' + (i === currentIndex ? ' active' : '');
    div.innerHTML = `
      <div class="chapter-time">${formatTime(ch.start)} → ${formatTime(ch.end)}</div>
      <div class="chapter-info">
        <div class="chapter-title">${ch.title}${i === currentIndex ? '<span class="playing"><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>' : ''}</div>
        <div class="chapter-desc">${ch.desc}</div>
      </div>
    `;
    div.onclick = () => {
      player.currentTime = ch.start;
      player.play();
    };
    list.appendChild(div);
  });
}

player.addEventListener('timeupdate', () => {
  const t = player.currentTime;
  const idx = chapters.findIndex(ch => t >= ch.start && t < ch.end);
  if (idx !== currentIndex) {
    currentIndex = idx;
    renderChapters();
  }
});

renderChapters();
</script>
</body>
</html>
